name: Scrape gold buyback prices

on:
  workflow_dispatch: {}

concurrency:
  group: scrape-gold-buyback-prices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run scraper
        run: npm run scrape

      - name: Commit updated data
        run: |
          git config user.name "gold-buyback-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/gold-buyback-prices.json
          git diff --cached --quiet || git commit -m "chore: update gold buyback price data [skip ci]"
          git push
